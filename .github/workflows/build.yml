name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Bypass Android SDK Licenses
      run: |
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\nd56f5187479451eabf01fb78af6dfcb131a648fa" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Pre-install Android SDK Tools (Fix path error)
      run: |
        SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/tools"
        if [ ! -f "$SDK_DIR/tools/bin/sdkmanager" ]; then
          echo "Downloading and placing commandline tools..."
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/extracted_tools
          mkdir -p "$SDK_DIR/tools/bin"
          cp -r /tmp/extracted_tools/cmdline-tools/* "$SDK_DIR/tools/"
          rm -rf /tmp/cmdtools.zip /tmp/extracted_tools
        fi

    - name: Cache Buildozer directory
      uses: actions/cache@v3
      with:
        path: |
          .buildozer
          bin/
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Initialize Buildozer config
      run: |
        buildozer init || true
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
